<!-- Contenedor principal del login -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-[90%] md:max-w-[650px] h-auto flex flex-col items-center p-4 md:p-0">
    <!-- Contenedor del formulario -->
    <div class="w-full max-w-[100%] md:max-w-[534px] p-4 md:p-6 rounded-xl border border-transparent bg-[#FEFEFF] shadow-md mb-4">
        <div class="flex items-center justify-center w-full h-[100px] mb-4 md:mb-6">
            <div class="w-[200px] h-[67.38px]">
                <img src="https://s3-alpha-sig.figma.com/img/b468/47e0/7a4d76d5e5326e185b1fbbece43de662?Expires=1731283200&Key-Pair-Id=APKAQ4GOSFWCVNEHN3O4&Signature=Ziq-MO7jVoPpb3lzUg5QGuiwOwW~McGxySpAslL4~X0USTk0yyFYMKMZqeC6HvyzSOhfUZ1HD9aA0l54DWXRhDpywdjSKxaaN59vxcSl2nZL-wbBBK1J2A3Pfl-~8o86uIu0VYcZhTZsKVgsnG5hz-z4ztOfFcsEhSbGdU6aHKfUixCAxcIw-Pm1-5F1Oe~x7gKDg8dAJZN~y601n-gydxBjOFFa2iNTaQk1g0CYe4iuD9QZkoTUkSZ53JByVD18PyE-9DXhePZ8ulOqYjvJRnnYcgS4jjwOkBtR60p3LgZYgaDIYSpIY0Bgi4fJrHLrJNg1PAl-RWOd9DQcuvqNUA__" alt="Logo" class="w-full h-full object-contain" />
            </div>
        </div>

        <h2 class="text-2xl font-semibold mb-4 md:mb-6 text-center text-gray-800">Iniciar sesión</h2>

        <!-- Campos de correo y contraseña -->
        <div class="w-full h-auto flex flex-col justify-between mb-4">
            <label for="email" class="text-sm font-semibold">Correo electrónico o documento</label>
            <input id="email" type="text" placeholder="StockIt@gmail.com" [(ngModel)]="email" required class="w-full h-[48px] bg-[#F8F9F8] border border-[#E0E9ED] rounded focus:outline-none px-3" (input)="validateEmail()" />
            <span *ngIf="emailError" class="text-red-500 text-sm">{{ emailError }}</span>
        </div>
        <div class="w-full h-auto flex flex-col justify-between">
            <label for="password" class="text-sm font-semibold">Contraseña</label>
            <input id="password" type="password" placeholder="*******" [(ngModel)]="password" required class="w-full h-[48px] bg-[#F8F9F8] border border-[#E0E9ED] rounded focus:outline-none px-3" (input)="validatePassword()" />
            <span *ngIf="passwordError" class="text-red-500 text-sm">{{ passwordError }}</span>
        </div>

        <!-- Botón de Ingresar -->
        <div class="w-full h-[48px] mt-4">
            <button class="w-full h-full rounded text-black text-sm font-semibold bg-[#34D399] hover:bg-[#75c6a8] transition duration-150" (click)="onLogin()" [disabled]="!email || !password || emailError || passwordError">Ingresar</button>
        </div>

        <!-- Enlace a Registro -->
        <p class="text-center mt-4 text-sm text-gray-600">
            ¿No tienes cuenta?
            <a routerLink="/registrar" class="text-[#34D399] font-semibold hover:underline">Regístrate aquí</a>
        </p>
    </div>
</div>
